version: 2

postal:
  # The hostname that the Postal web interface runs on
  web_hostname: postal.example.com
  # The HTTP protocol to use for the Postal web interface
  web_protocol: https
  # The hostname that the Postal SMTP server runs on
  smtp_hostname: postal.example.com
  # Should IP pools be enabled for this installation?
  use_ip_pools: false
  # The maximum number of delivery attempts
  default_maximum_delivery_attempts: 18
  # The number of days to hold a message before they will be expired
  default_maximum_hold_expiry_days: 7
  # The number of days an address will remain in a suppression list before being removed
  default_suppression_list_automatic_removal_days: 30
  # The default threshold at which a message should be treated as spam
  default_spam_threshold: 5
  # The default threshold at which a message should be treated as spam failure
  default_spam_failure_threshold: 20
  # Domain verification and checking usually checks with a domain's nameserver. Enable this to check with the server's local nameservers.
  use_local_ns_for_domain_verification: false
  # Append a Resend-Sender header to all outgoing e-mails
  use_resent_sender_header: true
  # Path to the private key used for signing
  signing_key_path: $config-file-root/signing.key
  # An array of SMTP relays in the format of smtp://user:password@host:port?ssl_mode=Auto&auth=plain. The credentials and the auth mechanism are optional; auth may be plain, login or cram_md5 and defaults to the strongest mechanism the relay advertises
  smtp_relays: []
  # An array of IP addresses to trust for proxying requests to Postal (in addition to localhost addresses)
  trusted_proxies: []
  # Hostnames or IP/CIDR ranges that outbound webhook and HTTP endpoint requests are permitted to reach even when they resolve to a private, loopback, link-local or otherwise reserved address. All other such destinations are blocked to prevent SSRF.
  allowed_request_destinations: []
  # The number of days after which to consider a lock as stale. Messages with stale locks will be removed and not retried.
  queued_message_lock_stale_days: 1
  # When enabled queued messages will be de-queued in batches based on their destination
  batch_queued_messages: true

web_server:
  # The default port the web server should listen on unless overriden by the PORT environment variable
  default_port: 5000
  # The default bind address the web server should listen on unless overriden by the BIND_ADDRESS environment variable
  default_bind_address: 127.0.0.1
  # The maximum number of threads which can be used by the web server
  max_threads: 5

worker:
  # The default port for the worker health server to listen on
  default_health_server_port: 9090
  # The default bind address for the worker health server to listen on
  default_health_server_bind_address: 127.0.0.1
  # The number of threads to execute within each worker
  threads: 2

main_db:
  # Hostname for the main MariaDB server
  host: localhost
  # The MariaDB port to connect to
  port: 3306
  # The MariaDB username
  username: postal
  # The MariaDB password
  password: 
  # The MariaDB database name
  database: postal
  # The maximum size of the MariaDB connection pool
  pool_size: 5
  # The encoding to use when connecting to the MariaDB database
  encoding: utf8mb4

message_db:
  # Hostname for the MariaDB server which stores the mail server databases
  host: localhost
  # The MariaDB port to connect to
  port: 3306
  # The MariaDB username
  username: postal
  # The MariaDB password
  password: 
  # The database to connect to for engines which need one: the PostgreSQL database which holds each server's schema, or the directory holding the per-server files for SQLite. Not used by MySQL/MariaDB, which keeps each server in its own database.
  database: 
  # The encoding to use when connecting to the MariaDB database
  encoding: utf8mb4
  # The MariaDB prefix to add to database names
  database_name_prefix: postal
  # The maximum number of bytes from a raw message stored in a single database row (in bytes). Larger messages are split across multiple rows so that no single query exceeds the server's max_allowed_packet limit. Lower this if your database server uses a small max_allowed_packet.
  raw_message_chunk_size: 4194304
  # The database engine used for the per-server message databases. Either 'mysql' (MySQL/MariaDB), 'postgresql' or 'sqlite'.
  adapter: mysql

blob_store:
  # Where the bodies of large raw messages are stored. The scheme selects the backend: 'inline://' (the default) keeps them in the message database, 'filesystem:///var/lib/postal/blobs?depth=2' writes them to disk, 's3://bucket/prefix' uses an S3-compatible bucket, and 'foundationdb://' uses a FoundationDB cluster.
  url: inline://
  # The minimum size of a message body (in bytes) before it is stored in the blob store rather than inline in the message database
  threshold: 1048576

analytics:
  # Where the daily analytics extract is written. The scheme selects the sink: 'duckdb:///var/lib/postal/analytics' (embedded), 'clickhouse://user:pass@host:8123/database', 'prometheus+http://host:8428' or 'influx+http://host:8086/database'. Leave unset to disable analytics.
  url: 

live_stats:
  # Where the live statistics (the last 60 minutes of message counts, shown on Postal's own dashboard) are kept. The scheme selects the store: 'mysql://' (the default) keeps them in the message database, 'valkey://host:6379/0' (or 'redis://', or any store speaking the Redis protocol) and 'aerospike://host:3000/namespace/set' use an in-memory store, and 'prometheus+http://host:8428' uses a Prometheus-compatible time-series store which can also stream to the dashboard as messages flow. The 'influx' and 'json' schemes are write-only: they accept the extract but cannot be read back by the dashboard.
  url: mysql://
  # The number of seconds of recent statistics a live query covers
  window: 3600

telemetry:
  # Where Postal pushes metrics and events as they happen, for external dashboards and alerting. The scheme selects the protocol and endpoint: 'prometheus+http://host:8428' (a Prometheus-compatible store such as VictoriaMetrics or Prometheus), 'influx+http://host:8086/database' or 'json+http://host:8686' (for example a vector.dev http_server source). Unset to disable telemetry.
  url: 
  # The number of seconds between telemetry flushes
  interval: 15
  # The maximum number of telemetry samples sent in a single request
  batch_size: 1000
  # The maximum number of telemetry samples buffered in memory before the oldest are dropped
  queue_size: 10000

logging:
  # Enable the default Rails logger
  rails_log_enabled: false
  # A DSN which should be used to report exceptions to Sentry
  sentry_dsn: 
  # Enable the Postal logger to log to STDOUT
  enabled: true
  # The minimum log level for the Postal logger (debug, info, warn, error, fatal)
  level: INFO
  # Enable highlighting of log lines
  highlighting_enabled: false

gelf:
  # GELF-capable host to send logs to
  host: 
  # GELF port to send logs to
  port: 12201
  # The facility name to add to all log entries sent to GELF
  facility: postal

smtp_server:
  # The default port the SMTP server should listen on unless overriden by the PORT environment variable
  default_port: 25
  # The default bind address the SMTP server should listen on unless overriden by the BIND_ADDRESS environment variable
  default_bind_address: ::
  # The default port for the SMTP server health server to listen on
  default_health_server_port: 9091
  # The default bind address for the SMTP server health server to listen on
  default_health_server_bind_address: 127.0.0.1
  # Enable TLS for the SMTP server (requires certificate)
  tls_enabled: false
  # The path to the SMTP server's TLS certificate
  tls_certificate_path: $config-file-root/smtp.cert
  # The path to the SMTP server's TLS private key
  tls_private_key_path: $config-file-root/smtp.key
  # Override ciphers to use for SSL
  tls_ciphers: 
  # Deprecated. Set min_version and max_version instead
  ssl_version: SSLv23
  # The oldest TLS version the SMTP server will negotiate (1.0, 1.1, 1.2 or 1.3)
  min_version: 1.2
  # The newest TLS version the SMTP server will negotiate (1.0, 1.1, 1.2 or 1.3)
  max_version: 
  # Override the ciphersuites to use for TLS 1.3 (tls_ciphers applies to TLS 1.2 and below)
  ciphersuites: 
  # Enable proxy protocol for use behind some load balancers (supports proxy protocol v1 only)
  proxy_protocol: false
  # Enable connection logging
  log_connections: false
  # The maximum message size to accept from the SMTP server (in MB)
  max_message_size: 14
  # The maximum number of recipients a client may send in a single transaction (0 for no limit)
  max_recipients: 100
  # Close an SMTP connection which has been idle for this many seconds (0 to disable)
  idle_timeout: 300
  # A regular expression to use to exclude connections from logging
  log_ip_address_exclusion_matcher: 

dns:
  # The names of the default MX records
  mx_records:
    - mx1.postal.example.com
    - mx2.postal.example.com
  # The location of the SPF record
  spf_include: spf.postal.example.com
  # The return path hostname
  return_path_domain: rp.postal.example.com
  # The domain to use for hosting route-specific addresses
  route_domain: routes.postal.example.com
  # The CNAME which tracking domains should be pointed to
  track_domain: track.postal.example.com
  # The hostname to use in HELO/EHLO when connecting to external SMTP servers
  helo_hostname: 
  # The identifier to use for DKIM keys in DNS records
  dkim_identifier: postal
  # The size (in bits) of RSA key to generate for DKIM signing (one of 1024, 2048, 3072 or 4096). Note that records for 2048-bit and larger keys exceed 255 characters and must be published as a split (multi-string) TXT record.
  dkim_key_size: 2048
  # The prefix to add before TXT record verification string
  domain_verify_prefix: postal-verification
  # The domain to use on external domains which points to the Postal return path domain
  custom_return_path_prefix: psrp
  # The address which aggregate DMARC reports should be sent to. Used when showing the recommended DMARC record for a domain. Postal does not store or apply a DMARC policy.
  dmarc_report_address: 
  # The address which failure DMARC reports should be sent to. Optional, and used when showing the recommended DMARC record for a domain.
  dmarc_failure_report_address: 
  # The destination which TLS-RPT reports for a domain should be sent to. Accepts a mailto: address or an https: endpoint, and may be a destination outside this installation.
  tls_rpt_address: 
  # The local part of the address which accepts TLS reports for a domain hosted here, so that mail to <local part>@<domain> is ingested as a report rather than delivered. Leave empty to disable ingestion.
  tls_rpt_local_part: tlsrpt
  # The timeout to wait for DNS resolution
  timeout: 5
  # The path to the resolv.conf file containing addresses for local nameservers
  resolv_conf_path: /etc/resolv.conf

mta_sts:
  # The directory in which certificates for MTA-STS policy hosts are stored
  certificate_directory: $config-file-root/mta-sts-certs
  # The path of the ACME account key used to request certificates
  account_key_path: $config-file-root/acme-account.key
  # The ACME directory to request certificates from
  acme_directory_url: https://acme-v02.api.letsencrypt.org/directory
  # An optional contact address to register with the ACME account
  contact_email: 

smtp:
  # The hostname to send application-level e-mails to
  host: 127.0.0.1
  # The port number to send application-level e-mails to
  port: 25
  # The username to use when authentication to the SMTP server
  username: 
  # The password to use when authentication to the SMTP server
  password: 
  # The type of authentication to use
  authentication_type: login
  # Use STARTTLS when connecting to the SMTP server and fail if unsupported
  enable_starttls: false
  # Detects if STARTTLS is enabled in the SMTP server and starts to use it
  enable_starttls_auto: true
  # When using TLS, you can set how OpenSSL checks the certificate. Use 'none' for no certificate checking
  openssl_verify_mode: peer
  # The name to use as the from name outgoing emails from Postal
  from_name: Postal
  # The e-mail to use as the from address outgoing emails from Postal
  from_address: postal@example.com

rails:
  # The Rails environment to run the application in
  environment: production
  # The secret key used to sign and encrypt cookies and session data in the application
  secret_key: 

rspamd:
  # Enable rspamd for message inspection
  enabled: false
  # The hostname of the rspamd server
  host: 127.0.0.1
  # The port of the rspamd server
  port: 11334
  # Enable SSL for the rspamd connection
  ssl: false
  # The password for the rspamd server
  password: 
  # Any flags for the rspamd server
  flags: 

spamd:
  # Enable SpamAssassin for message inspection
  enabled: false
  # The hostname for the SpamAssassin server
  host: 127.0.0.1
  # The port of the SpamAssassin server
  port: 783

clamav:
  # Enable ClamAV for message inspection
  enabled: false
  # The host of the ClamAV server
  host: 127.0.0.1
  # The port of the ClamAV server
  port: 2000

smtp_client:
  # The oldest TLS version to negotiate with remote servers. Lower this only to reach a server which cannot do better
  minimum_tls_version: 1.2
  # Deliver to a domain which publishes an MTA-STS policy only over verified TLS and only to the hosts that policy lists
  mta_sts: true
  # The open timeout for outgoing SMTP connections
  open_timeout: 30
  # The read timeout for outgoing SMTP connections
  read_timeout: 30

protection:
  # Enable rate limiting and brute-force protection for Postal's public endpoints
  enabled: true
  # Where rate limit counters are kept. Use memory:// to count within this process, or redis://host:6379/0 (Valkey is accepted as valkey://host:6379/0) to share the counts between workers
  counter_store: memory://
  # The prefix applied to every rate limit key
  prefix: postal:limits
  # The number of SMTP authentication attempts allowed per IP address before it is refused
  smtp_auth_attempts_limit: 10
  # The period, in seconds, over which SMTP authentication attempts are counted and for which an address is refused
  smtp_auth_attempts_period: 900
  # The number of SMTP connections allowed per IP address within the period
  smtp_connections_limit: 60
  # The period, in seconds, over which SMTP connections per IP address are counted
  smtp_connections_period: 60
  # The maximum number of concurrent SMTP connections (0 for no limit)
  smtp_max_connections: 0
  # The number of failed API authentication attempts allowed per IP address
  api_auth_failures_limit: 20
  # The period, in seconds, over which failed API authentication attempts are counted
  api_auth_failures_period: 300
  # The number of failed web login attempts allowed per address
  web_login_failures_limit: 10
  # The period, in seconds, over which failed web login attempts are counted
  web_login_failures_period: 300
  # The number of password reset requests allowed for one e-mail address, and from one client address, before they are refused
  web_password_reset_limit: 5
  # The period, in seconds, over which password reset requests are counted
  web_password_reset_period: 900
  # Where quota counters are kept. Defaults to the value of counter_store, so quotas share the same store as the failure counters unless isolated here. Accepts the same memory://, redis:// and valkey:// URLs
  quota_store: 
  # What happens when a quota is exceeded: reject refuses the request, defer queues it for a later retry where the caller supports it
  quota_exceed_action: reject
  # The number of API requests allowed per credential within the period (0 for no limit)
  api_send_limit: 0
  # The period, in seconds, over which API requests per credential are counted
  api_send_period: 3600
  # The number of messages allowed per SMTP credential within the period (0 for no limit)
  smtp_send_limit: 0
  # The period, in seconds, over which messages per SMTP credential are counted
  smtp_send_period: 3600
  # The number of messages allowed per SMTP-IP credential within the period (0 for no limit)
  smtp_ip_send_limit: 0
  # The period, in seconds, over which messages per SMTP-IP credential are counted
  smtp_ip_send_period: 3600
  # The number of password reset redemptions allowed per client address before they are refused (0 for no limit)
  reset_redeem_limit: 0
  # The period, in seconds, over which password reset redemptions are counted
  reset_redeem_period: 900
  # The number of unauthenticated intake deliveries allowed per client address within the period (0 for no limit)
  unauth_intake_limit: 0
  # The period, in seconds, over which unauthenticated intake deliveries are counted
  unauth_intake_period: 3600

sessions:
  # How long a session may sit unused, in seconds, before it is refused
  inactivity_timeout: 43200
  # How long a remembered login lasts, in seconds
  persistent_length: 5184000
  # How long a session may act, in seconds, after a password is confirmed
  sudo_timeout: 600

migration_waiter:
  # Wait for all migrations to run before starting a process
  enabled: false
  # The number of attempts to try waiting for migrations to complete before start
  attempts: 120
  # The number of seconds to wait between each migration check
  sleep_time: 2

oidc:
  # Enable OIDC authentication
  enabled: false
  # When enabled, users with passwords will still be able to login locally. If disable, only OpenID Connect will be available.
  local_authentication_enabled: true
  # The name of the OIDC provider as shown in the UI
  name: OIDC Provider
  # The OIDC issuer URL
  issuer: 
  # The client ID for OIDC
  identifier: 
  # The client secret for OIDC
  secret: 
  # Scopes to request from the OIDC server.
  scopes:
    - openid
    - email
  # The field to use to determine the user's UID
  uid_field: sub
  # The field to use to determine the user's email address
  email_address_field: email
  # The field to use to determine the user's name
  name_field: name
  # Enable discovery to determine endpoints from .well-known/openid-configuration from the Issuer
  discovery: true
  # The authorize endpoint on the authorization server (only used when discovery is false)
  authorization_endpoint: 
  # The token endpoint on the authorization server (only used when discovery is false)
  token_endpoint: 
  # The user info endpoint on the authorization server (only used when discovery is false)
  userinfo_endpoint: 
  # The JWKS endpoint on the authorization server (only used when discovery is false)
  jwks_uri: 
